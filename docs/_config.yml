title: Scopocket Documentation
remote_theme: zendesk/jekyll-theme-zendesk-garden@main

search_enabled: true
auto_page_title: true
version: false

sidebar:
  - getting-started
  - companion-app
  - pin-reference
  - manufacturing
  - technical-specs
  - poster

# The companion app (docs/app) is served as-is; keep its developer files
# out of the generated site and its search index.
exclude:
  - app/README.md
  - app/tests
  - app/tools
